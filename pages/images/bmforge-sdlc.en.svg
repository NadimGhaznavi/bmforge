<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1720" height="1100" viewBox="0 0 1720 1100" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">BMForge architecture</title>
<desc id="desc">The human architect directs and approves the AI coding agent. BMForge component specifications are pinned as project-local skills. The agent uses these skills to build and verify application code. The source repository ships code, tests and pinned skills together to contributors and their agents. Only application code is installed for runtime; BMForge is not a runtime dependency. Field experience informs reviewed specification updates.</desc>
