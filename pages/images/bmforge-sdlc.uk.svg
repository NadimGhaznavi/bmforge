<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1720" height="1100" viewBox="0 0 1720 1100" role="img" aria-labelledby="title desc" xml:lang="uk">
<title id="title">Архітектура BMForge</title>
<desc id="desc">Архітектор визначає завдання AI-агента та схвалює його роботу. Специфікації компонентів BMForge закріплюються як локальні навички проєкту. Агент використовує ці навички для розробки й перевірки коду. Репозиторій поширює код, тести та закріплені навички разом, щоб учасники й їхні агенти мали ті самі настанови. Під час роботи застосунку BMForge не потрібен. Досвід експлуатації допомагає вдосконалювати специфікації після перегляду.</desc>
<defs>
  <radialGradient id="background"><stop stop-color="#14202a"/><stop offset="1" stop-color="#0b1117"/></radialGradient>
  <linearGradient id="blue-panel" x2="1" y2="1"><stop stop-color="#153346"/><stop offset="1" stop-color="#101c28"/></linearGradient>
  <linearGradient id="green-panel" x2="1" y2="1"><stop stop-color="#123b30"/><stop offset="1" stop-color="#10251f"/></linearGradient>
  <linearGradient id="gold-panel" x2="1" y2="1"><stop stop-color="#3b3120"/><stop offset="1" stop-color="#211e17"/></linearGradient>
  <linearGradient id="purple-panel" x2="1" y2="1"><stop stop-color="#2b2b46"/><stop offset="1" stop-color="#1b2030"/></linearGradient>
  <symbol id="person" viewBox="0 0 100 100"><circle cx="50" cy="26" r="17"/><path d="M17 87v-9c0-22 14-33 33-33s33 11 33 33v9M33 88V69M67 88V69"/></symbol>
  <symbol id="agent" viewBox="0 0 100 100"><rect x="20" y="25" width="60" height="55" rx="12"/><path d="M50 25V12M36 80v12M64 80v12M20 42H9M20 64H9M80 42h11M80 64h11M37 64h26"/><circle cx="38" cy="46" r="4" fill="currentColor" stroke="none"/><circle cx="62" cy="46" r="4" fill="currentColor" stroke="none"/><circle cx="50" cy="9" r="4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="specs" viewBox="0 0 100 100"><path d="M20 14h44l17 17v58H20zM64 14v18h17M34 46h32M34 60h32M34 74h22"/><path d="M11 78H7V6h55" opacity=".5"/></symbol>
  <symbol id="code" viewBox="0 0 100 100"><rect x="6" y="12" width="88" height="76" rx="9"/><path d="M6 31h88M35 47 21 59l14 12M65 47l14 12-14 12M56 43 44 77"/><circle cx="17" cy="22" r="2" fill="currentColor" stroke="none"/><circle cx="27" cy="22" r="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="skills" viewBox="0 0 100 100"><path d="M18 13h47l16 16v58H18zM65 13v18h16M32 45l5 5 9-11M53 45h15M32 64l5 5 9-11M53 64h15"/></symbol>
  <symbol id="contributors" viewBox="0 0 100 100"><circle cx="36" cy="24" r="13"/><circle cx="70" cy="28" r="10"/><path d="M9 64v-6c0-15 11-22 27-22s27 7 27 22v6M63 42c17-2 28 7 28 21"/><rect x="18" y="64" width="64" height="24" rx="3"/><path d="M10 91h80M44 77h12"/></symbol>
  <symbol id="server" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="23" rx="5"/><rect x="10" y="39" width="80" height="23" rx="5"/><rect x="10" y="68" width="80" height="23" rx="5"/><path d="M39 22h34M39 51h34M39 80h34"/><circle cx="24" cy="22" r="3" fill="currentColor" stroke="none"/><circle cx="24" cy="51" r="3" fill="currentColor" stroke="none"/><circle cx="24" cy="80" r="3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="repository" viewBox="0 0 100 100"><path d="M6 26h33l10 12h45v46H6zM6 38V20h29l10 10h45v8"/></symbol>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#24a8ff"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1edc9a"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ffb21c"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a780ff"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#acc1d7"/></marker>
</defs>
<rect width="1720" height="1100" fill="url(#background)"/>
<text x="860" y="69" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="45" font-weight="700" fill="#eff5ff">Архітектура BMForge</text>
<text x="860" y="111" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#acc1d7">Створюй застосунок. Поширюй знання для його розвитку.</text>
<rect x="40" y="260" width="310" height="210" rx="22" fill="url(#blue-panel)" stroke="#24a8ff" stroke-width="3"/>
<rect x="535" y="260" width="345" height="210" rx="22" fill="url(#purple-panel)" stroke="#a780ff" stroke-width="3"/>
<rect x="40" y="675" width="310" height="250" rx="22" fill="url(#gold-panel)" stroke="#ffb21c" stroke-width="3"/>
<rect x="495" y="640" width="700" height="280" rx="22" fill="url(#green-panel)" stroke="#1edc9a" stroke-width="3"/>
