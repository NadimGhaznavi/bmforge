<rect x="860" y="705" width="310" height="190" rx="22" fill="url(#gold-panel)" stroke="#ffb21c" stroke-width="3"/>
<rect x="1310" y="260" width="355" height="250" rx="22" fill="url(#blue-panel)" stroke="#24a8ff" stroke-width="3"/>
<rect x="1310" y="675" width="355" height="250" rx="22" fill="url(#green-panel)" stroke="#1edc9a" stroke-width="3"/>
<use xlink:href="#person" x="163" y="278" width="65" height="65" fill="none" stroke="currentColor" color="#24a8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="195" y="380" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#eff5ff">Архітектор</text>
<text x="195" y="416" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#acc1d7">Вимоги й архітектура</text>
<text x="195" y="447" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#acc1d7">Перегляд і схвалення</text>
<use xlink:href="#agent" x="670" y="275" width="75" height="75" fill="none" stroke="currentColor" color="#a780ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="708" y="382" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700" fill="#eff5ff">AI-агент</text>
<text x="708" y="417" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#acc1d7">Дотримується настанов</text>
<text x="708" y="448" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#acc1d7">Розробляє й перевіряє</text>
<use xlink:href="#specs" x="154" y="694" width="82" height="82" fill="none" stroke="currentColor" color="#ffb21c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="195" y="814" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#eff5ff">BMForge</text>
<text x="195" y="853" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#acc1d7">Специфікації та шаблони</text>
<text x="195" y="887" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#acc1d7">Версійні навички компонентів</text>
<use xlink:href="#repository" x="522" y="655" width="45" height="45" fill="none" stroke="currentColor" color="#1edc9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="580" y="684" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#eff5ff">Репозиторій проєкту</text>
<use xlink:href="#code" x="628" y="722" width="82" height="82" fill="none" stroke="currentColor" color="#24a8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="670" y="844" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#eff5ff">Код і тести</text>
<text x="670" y="877" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#acc1d7">Власна реалізація</text>
<use xlink:href="#skills" x="974" y="722" width="82" height="82" fill="none" stroke="currentColor" color="#ffb21c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1015" y="844" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#eff5ff">Закріплені навички</text>
<text x="1015" y="877" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#acc1d7">Специфікації й настанови</text>
<use xlink:href="#contributors" x="1438" y="282" width="98" height="98" fill="none" stroke="currentColor" color="#24a8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1488" y="414" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#eff5ff">Учасники та AI-агенти</text>
<text x="1488" y="454" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#acc1d7">Ті самі правила розробки</text>
<text x="1488" y="488" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#acc1d7">Супровід і вдосконалення</text>
<use xlink:href="#server" x="1443" y="697" width="90" height="90" fill="none" stroke="currentColor" color="#1edc9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1488" y="833" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#eff5ff">Запущений застосунок</text>
<text x="1488" y="870" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#acc1d7">Власний код застосунку</text>
<text x="1488" y="903" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#acc1d7">Без залежності від BMForge</text>
<path d="M350 365H531" fill="none" stroke="#24a8ff" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="372.5" y="318" width="137" height="33" rx="5" fill="#0b1117"/>
<text x="441" y="341" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#eff5ff">Схвалення</text>
<path d="M685 470V636" fill="none" stroke="#a780ff" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect x="577.5" y="552" width="215" height="33" rx="5" fill="#0b1117"/>
<text x="685" y="575" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#eff5ff">Розробка й тести</text>
<path d="M1015 705V365H884" fill="none" stroke="#ffb21c" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-gold)"/>
<rect x="882.0" y="524" width="266" height="33" rx="5" fill="#0b1117"/>
<text x="1015" y="547" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#eff5ff">Використання навичок</text>
<path d="M1140 640V205H1488V256" fill="none" stroke="#24a8ff" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="1153.5" y="183" width="321" height="33" rx="5" fill="#0b1117"/>
<text x="1314" y="206" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#eff5ff">Клонування: код і навички</text>
<path d="M350 790H415V975H1015V899" fill="none" stroke="#ffb21c" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-gold)"/>
