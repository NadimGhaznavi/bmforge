<text x="690" y="976" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#eff5ff">Закріпити вибрані навички</text>
<path d="M820 800H840V950H1240V800H1306" fill="none" stroke="#1edc9a" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="907.0" y="928" width="316" height="33" rx="5" fill="#0b1117"/>
<text x="1065" y="951" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#eff5ff">Встановити код застосунку</text>
<path d="M1488 925V1040H195V929" fill="none" stroke="#acc1d7" stroke-width="4" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#arrow-muted)"/>
<rect x="548.0" y="1018" width="584" height="33" rx="5" fill="#0b1117"/>
<text x="840" y="1041" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#acc1d7">Досвід експлуатації → переглянуті специфікації</text>
</svg>
